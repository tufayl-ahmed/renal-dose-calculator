<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Rule Review · Renal Dose</title>
    <link rel="icon" href="/assets/pwa/icon-192.png" sizes="192x192" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="review-page">
    <header class="app-bar">
      <div class="app-bar-inner">
        <div class="brand">
          <img class="brand-mark" src="/assets/brand/renal-logo.png" alt="" width="36" height="36" />
          <div>
            <h1>Rule review</h1>
            <p class="brand-sub"><a href="/app/">Back to the calculator</a></p>
          </div>
        </div>
        <div class="app-bar-actions">
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Theme: system" title="Theme: system">
            <svg class="theme-icon theme-icon-system" aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="13" rx="2" />
              <path d="M8 21h8" />
              <path d="M12 17v4" />
            </svg>
            <svg class="theme-icon theme-icon-light" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
            <svg class="theme-icon theme-icon-dark" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="review-layout">
      <section class="card review-intro">
        <p>
          Check each record against its DailyMed label, then mark it <strong>Verified</strong> or
          <strong>Retired</strong>. Decisions are saved in this browser only. When you are done, export the CSV and run
          <code>npm run rules:import -- &lt;file&gt;</code> in the project to publish them.
        </p>
        <div class="review-toolbar">
          <div class="field">
            <label for="reviewer">Reviewer name</label>
            <input id="reviewer" autocomplete="name" placeholder="e.g. Dr. Tufayl (Cortex Labs)" />
          </div>
          <div class="field">
            <label for="review-search">Search</label>
            <input id="review-search" type="search" placeholder="Drug name" />
          </div>
          <div class="field">
            <label for="review-filter">Show</label>
            <select id="review-filter">
              <option value="todo">Needs review</option>
              <option value="decided">Decided here</option>
              <option value="verified">Already verified</option>
              <option value="candidate">Auto-extracted only</option>
              <option value="all">All records</option>
            </select>
          </div>
        </div>
        <div class="review-actions">
          <p class="review-counts" id="review-counts" aria-live="polite"></p>
          <button class="button button-primary button-small" id="export-decisions" type="button">
            Export decisions (CSV)
          </button>
          <button class="button button-text button-small" id="clear-decisions" type="button">
            Clear local decisions
          </button>
        </div>
      </section>

      <div class="review-list" id="review-list"></div>
      <p class="review-more hidden" id="review-more"></p>
    </main>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/review.js"></script>
  </body>
</html>
